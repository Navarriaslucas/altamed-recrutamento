{% extends "base_admin.html" %}
{% block content %}
<div class="page-head"><h1>Cadastrar usuário</h1></div>
<form method="post" class="card" style="max-width:560px"><input type="hidden" name="csrf" value="{{ csrf_token }}">
<div class="field"><label for="nome">Nome completo</label><input id="nome" name="nome" type="text" required></div>
<div class="field"><label for="email">E-mail corporativo</label><input id="email" name="email" type="email" placeholder="nome@grupoaltamed.com.br" required></div>
<div class="field"><label for="perfil">Perfil</label><select id="perfil" name="perfil"><option>Responsável</option><option>Gerência</option></select></div>
<div class="field"><label for="senha">Senha inicial</label><input id="senha" name="senha" type="password" minlength="8" autocomplete="new-password" required><span class="hint">Mínimo de 8 caracteres.</span></div>
<label class="check" style="margin-bottom:18px"><input type="checkbox" name="ativo" checked> <span>Usuário ativo</span></label>
<div class="actions"><button class="button">Salvar usuário</button><a class="button button-ghost" href="{{ url_for('usuarios') }}">Cancelar</a></div></form>{% endblock %}
